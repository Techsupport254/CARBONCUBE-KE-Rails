# config/schedule.yml
# Recurring jobs managed by sidekiq-cron.
# Replaces all recursive self-scheduling patterns.
# Cron format: minute hour day-of-month month day-of-week
# Reference: https://crontab.guru

# --- CALL CENTER ---
# Refresh call center KPIs and chart data every 5 minutes.
# Replaces the recursive CallCenterMetricsJob.set(wait: 5.minutes).perform_later pattern.
call_center_metrics:
  cron: "*/5 * * * *"
  class: "CallCenterMetricsJob"
  queue: default
  description: "Refresh call center KPIs and chart data for all periods"

# --- SEARCH ANALYTICS ---
# Sync search analytics from Redis to PostgreSQL nightly at 1:00 AM EAT (22:00 UTC).
sync_search_analytics:
  cron: "0 22 * * *"
  class: "SyncSearchAnalyticsJob"
  queue: low
  description: "Persist daily search analytics from Redis to PostgreSQL"

# --- PHONE UPDATE CAMPAIGN ---
# Request phone numbers from sellers missing a phone number weekly on Mondays at 9:00 AM EAT (06:00 UTC).
# Automatically excludes sellers who have added their phone numbers.
request_phone_number_campaign:
  cron: "0 6 * * 1"
  class: "SendPhoneUpdateReminderJob"
  args: [false, 1]
  queue: broadcast
  description: "Weekly campaign requesting phone numbers for active sellers missing a contact phone number"

# --- DOCUMENT COMPLIANCE ---
# Check for unverified or expired seller documents every Monday at 8:00 AM EAT (05:00 UTC).
# Enqueues a reminder for each non-compliant seller.
document_compliance_check:
  cron: "0 5 * * 1"
  class: "DocumentComplianceCheckJob"
  queue: low
  description: "Weekly check for unverified or expired seller documents and enqueue reminders"

# --- GOOGLE REVIEWS ---
# Refresh owner-authorized Google Business Profile reviews once a month on the 1st at 3:00 AM EAT (00:00 UTC).
sync_google_reviews:
  cron: "0 0 1 * *"
  class: "SyncGoogleReviewsSchedulerJob"
  queue: low
  description: "Schedule distributed monthly refresh of connected Google Business Profile reviews"

# --- REVIEW PROMPTS ---
# Create and send pending product review prompts every hour.
# First prompt is sent 24h after a buyer reveals seller details or messages the seller.
# Two email reminders follow at 3 and 7 days if the buyer has not reviewed.
send_review_prompts:
  cron: "0 * * * *"
  class: "SendReviewPromptsJob"
  queue: low
  description: "Create and email product review prompts to qualifying buyers"

# --- FIELD LOCATIONS ---
# Flush hourly field location pings from Redis to PostgreSQL at 5:00 PM EAT (14:00 UTC).
# Pings are collected from sales users every hour 8am-4pm; this job persists them
# as a single row per user per day with a JSONB array of all pings.
sync_field_locations:
  cron: "0 14 * * *"
  class: "SyncFieldLocationsJob"
  queue: low
  description: "Flush daily field location pings from Redis to PostgreSQL"

# --- GEOCODING ---
# Re-geocode seller branches with missing or coarse coordinates every night.
# Nominatim requires <= 1 req/sec and the job handles that internally.
geocode_sellers:
  cron: "0 2 * * *"
  class: "GeocodeSellersJob"
  queue: low
  description: "Backfill and improve geocoding for seller branches"

# --- SALES ONBOARDING SUMMARY ---
# Send every sales user a Wednesday 7:00 AM EAT (04:00 UTC) email summarising
# the sellers onboarded in the past 7 days. Managers and leads also see the
# full team leaderboard and all team onboardings.
weekly_seller_onboarding_summary:
  cron: "0 4 * * 3"
  class: "WeeklySellerOnboardingSummaryJob"
  queue: low
  description: "Weekly sales onboarding email with personal and team seller lists"

refresh_ad_stats:
  cron: "*/15 * * * *"
  class: "RefreshAdStatsJob"
  queue: low
  description: "Refresh pre-aggregated ad_stats materialized view"

# --- PARTNER INVITES ---
# Sweep pending partner/distributor/contact invites hourly: send reminder 1
# (T+2d) and reminder 2 (T+5d) with distinct copy, then expire invites at
# 7 days and alert the internal team so a human can follow up.
partner_invite_reminders:
  cron: "0 * * * *"
  class: "PartnerInviteReminderJob"
  queue: low
  description: "Send partner invite reminders and expire lapsed invites"

# --- BRAND KENYA ---
# Hourly sweep for directory brands that reached onboarded status; emails
# them the complete-profile nudge. The job itself returns early unless
# Rails.env.production? so it no-ops on dev/staging workers.
brand_kenya_onboarded_notify:
  cron: "0 * * * *"
  class: "BrandKenyaOnboardedNotifyJob"
  queue: low
  description: "Email newly onboarded Brand Kenya brands to complete their profile (production only)"

# --- MONITORING RETENTION ---
# monitoring_metrics gets an INSERT on every request — purge rows older than
# 7 days nightly so the table doesn't grow unboundedly.
monitoring_cleanup:
  cron: "30 3 * * *"
  class: "MonitoringCleanupJob"
  queue: low
  description: "Delete monitoring_metrics/monitoring_errors rows older than 7 days"

# --- CATALOG UPLOAD REQUEST (NEW SELLERS) ---
# Nudge sellers to send us their catalog roughly 1–2 days after they register.
# Picks up sellers created 24–48h ago, once per day, all four channels.
catalog_upload_new_sellers:
  cron: "0 6 * * *"
  class: "SendCatalogUploadToNewSellersJob"
  queue: broadcast
  description: "Daily catalog upload request to sellers registered 24–48h ago"

# --- CATALOG UPLOAD REMINDER (NEW SELLERS AFTER 1 WEEK) ---
# Follow-up for new sellers roughly 1 week (7–8 days) after registration
# who have not uploaded any products/ads yet.
# Picks up sellers created 168–192h ago, once per day at 9:30 AM EAT (06:30 UTC), all four channels.
catalog_upload_week_reminder_new_sellers:
  cron: "30 6 * * *"
  class: "SendCatalogUploadReminderToNewSellersJob"
  queue: broadcast
  description: "Daily catalog upload reminder to new sellers registered 1 week ago with no products"

# --- WHATSAPP UPDATES INVITE & REMINDER (NEW USERS) ---
# Send an email invite to new users 2 days after registration to join WhatsApp updates (wa.me link with START keyword).
# Sends a reminder email ~3 days later if they haven't subscribed or engaged on WhatsApp yet.
# Runs daily at 10:00 AM EAT (07:00 UTC).
send_whatsapp_updates_invite:
  cron: "0 7 * * *"
  class: "SendWhatsappUpdatesInviteJob"
  queue: broadcast
  description: "Daily WhatsApp updates email invite (T+2d) and reminder (T+5d) to new users"


# --- APP STORE / PLAY STORE IN-APP REVIEW ---
# Identify users who have been active for at least 7 days with 3+ sessions
# and schedule them for the native in-app review dialog.
# Runs once a day at 3:00 AM EAT (00:00 UTC). Users who have already been
# prompted (or shown the dialog) are automatically excluded.
schedule_app_store_review_prompts:
  cron: "0 0 * * *"
  class: "ScheduleAppStoreReviewPromptsJob"
  queue: low
  description: "Schedule qualifying users for the native App Store / Play Store review dialog"

# --- APP INSTALL NUDGE ---
# Email buyers and sellers who registered 3–90 days ago but have never opened
# the mobile app (no iOS/Android DeviceToken). Each user receives the email
# exactly once thanks to a Notification title guard in the job.
# Runs daily at 8:00 AM EAT (05:00 UTC).
send_app_install_nudge:
  cron: "0 5 * * *"
  class: "SendAppInstallNudgeJob"
  queue: broadcast
  description: "Daily email nudge to registered users who have never installed the mobile app"

# --- ORGANIC FEATURED ROTATION ---
# Elect and rotate merit-based featured listings across categories every 6 hours.
# Evaluates ad quality, 7-day engagement (clicks/reveals), and upload recency.
# Staggers 7-day featured windows with a 14-day anti-monopoly cooldown.
evaluate_organic_featured_ads:
  cron: "0 */6 * * *"
  class: "EvaluateOrganicFeaturedAdsJob"
  queue: low
  description: "Evaluate and rotate merit-based featured ads across categories"

