# config/schedule.yml
# Recurring jobs managed by sidekiq-cron.
# Replaces all recursive self-scheduling patterns.
# Cron format: minute hour day-of-month month day-of-week
# Reference: https://crontab.guru

# --- CALL CENTER ---
# Refresh call center KPIs and chart data every 5 minutes.
# Replaces the recursive CallCenterMetricsJob.set(wait: 5.minutes).perform_later pattern.
call_center_metrics:
  cron: "*/5 * * * *"
  class: "CallCenterMetricsJob"
  queue: default
  description: "Refresh call center KPIs and chart data for all periods"

# --- BEST SELLERS ---
# Precompute best-seller rankings every 30 minutes for fast homepage loading.
precompute_best_sellers:
  cron: "*/30 * * * *"
  class: "PrecomputeBestSellersJob"
  queue: low
  description: "Precompute best-seller scores for homepage and category pages"

# --- SEARCH ANALYTICS ---
# Sync search analytics from Redis to PostgreSQL nightly at 1:00 AM EAT (22:00 UTC).
sync_search_analytics:
  cron: "0 22 * * *"
  class: "SyncSearchAnalyticsJob"
  queue: low
  description: "Persist daily search analytics from Redis to PostgreSQL"

# --- PHONE UPDATE CAMPAIGN ---
# Request phone numbers from sellers missing a phone number weekly on Mondays at 9:00 AM EAT (06:00 UTC).
# Automatically excludes sellers who have added their phone numbers.
request_phone_number_campaign:
  cron: "0 6 * * 1"
  class: "SendPhoneUpdateReminderJob"
  args: [false, 1]
  queue: broadcast
  description: "Weekly campaign requesting phone numbers for active sellers missing a contact phone number"

# --- DOCUMENT COMPLIANCE ---
# Check for unverified or expired seller documents every Monday at 8:00 AM EAT (05:00 UTC).
# Enqueues a reminder for each non-compliant seller.
document_compliance_check:
  cron: "0 5 * * 1"
  class: "DocumentComplianceCheckJob"
  queue: low
  description: "Weekly check for unverified or expired seller documents and enqueue reminders"

# --- GOOGLE REVIEWS ---
# Refresh Google Place reviews for sellers once a month on the 1st at 3:00 AM EAT (00:00 UTC).
# Each seller is spaced 10 minutes apart to stay within the free 1,000 requests/month cap.
sync_google_reviews:
  cron: "0 0 1 * *"
  class: "SyncGoogleReviewsSchedulerJob"
  queue: low
  description: "Schedule distributed monthly refresh of Google Place reviews for all sellers"

# --- FIELD LOCATIONS ---
# Flush hourly field location pings from Redis to PostgreSQL at 5:00 PM EAT (14:00 UTC).
# Pings are collected from sales users every hour 8am-4pm; this job persists them
# as a single row per user per day with a JSONB array of all pings.
sync_field_locations:
  cron: "0 14 * * *"
  class: "SyncFieldLocationsJob"
  queue: low
  description: "Flush daily field location pings from Redis to PostgreSQL"

# --- GEOCODING ---
# Re-geocode seller branches with missing or coarse coordinates every night.
# Nominatim requires <= 1 req/sec and the job handles that internally.
geocode_sellers:
  cron: "0 2 * * *"
  class: "GeocodeSellersJob"
  queue: low
  description: "Backfill and improve geocoding for seller branches"

# --- SALES ONBOARDING SUMMARY ---
# Send every sales user a Wednesday 7:00 AM EAT (04:00 UTC) email summarising
# the sellers onboarded in the past 7 days. Managers and leads also see the
# full team leaderboard and all team onboardings.
weekly_seller_onboarding_summary:
  cron: "0 4 * * 3"
  class: "WeeklySellerOnboardingSummaryJob"
  queue: low
  description: "Weekly sales onboarding email with personal and team seller lists"

